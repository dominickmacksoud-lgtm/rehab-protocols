name: Link Health Check

# Detector half of link health. Runs check-links.py over every URL in both CSVs,
# then link-issue.py turns link-report.json into one GitHub issue (label:
# link-check) with a Wayback suggestion per broken URL, verified through the
# checker's own fetch path. The issue is created, refreshed with a comment, or
# closed as links recover. Nothing here touches the CSVs or the live site.
#
# The previous week's report is carried across runs in the Actions cache so the
# issue can say which failures are new. The triage routine on claude.ai reads the
# open issue afterwards and comments with replacement URLs it can find.

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday at 09:00 UTC
  workflow_dispatch:        # Manual trigger from the Actions tab

permissions:
  issues: write
  contents: read

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore last run's report
        uses: actions/cache/restore@v4
        with:
          path: link-report.json
          key: link-report-${{ github.run_id }}
          restore-keys: link-report-

      - name: Keep the previous report for the diff
        run: |
          if [ -f link-report.json ]; then
            cp link-report.json link-report.previous.json
            echo "Previous report dated $(python3 -c 'import json;print(json.load(open("link-report.json"))["date"])')"
          else
            echo "No previous report in cache; first run or cache expired."
          fi

      - name: Run link checker
        run: python check-links.py
        continue-on-error: true   # exit 1 means broken links, which is what the issue is for

      - name: Build issue body
        id: report
        run: python link-issue.py --previous link-report.previous.json --out issue-body.md

      - name: Save this run's report for next week
        if: always() && hashFiles('link-report.json') != ''
        uses: actions/cache/save@v4
        with:
          path: link-report.json
          key: link-report-${{ github.run_id }}

      - name: Create, refresh, or close the link-health issue
        uses: actions/github-script@v7
        env:
          HAS_PROBLEMS: ${{ steps.report.outputs.has_problems }}
          ISSUE_TITLE: ${{ steps.report.outputs.title }}
          RUN_DATE: ${{ steps.report.outputs.run_date }}
          BROKEN_COUNT: ${{ steps.report.outputs.broken_count }}
          MOVED_COUNT: ${{ steps.report.outputs.moved_count }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const hasProblems = process.env.HAS_PROBLEMS === "true";
            const title = process.env.ISSUE_TITLE;
            const runDate = process.env.RUN_DATE;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "link-check", per_page: 100,
            });
            const existing = open.find(i => !i.pull_request);

            if (!hasProblems) {
              if (!existing) {
                console.log("All links healthy and no open issue. Nothing to do.");
                return;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `All links passed on ${runDate}. Closing automatically.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed",
              });
              console.log(`Closed issue #${existing.number}`);
              return;
            }

            const body = fs.readFileSync("issue-body.md", "utf8");
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title, body,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Re-checked on ${runDate}: ${process.env.BROKEN_COUNT} broken, `
                    + `${process.env.MOVED_COUNT} moved. The issue body above has been refreshed.`,
              });
              console.log(`Refreshed issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ["link-check"],
              });
              console.log(`Created issue #${created.data.number}`);
            }
